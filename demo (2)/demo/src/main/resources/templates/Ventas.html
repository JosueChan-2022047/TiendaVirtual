<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/VentasP.css}">
</head>
<body class="bg-light">

<nav class="navbar mb-4 custom-nav">
    <div class="container-fluid">
        <a th:href="@{/home}" class="back-link">⬅ Volver al Home</a>
        <span class="navbar-title">Sistema de Ventas</span>
    </div>
</nav>

<div class="container bg-white p-4 shadow-sm rounded">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Registro de Ventas</h2>
        <button type="button" class="btn btn-success" onclick="nuevaVenta()">+ Generar Venta</button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>codigo_venta</th>
                <th>fecha_venta</th>
                <th>total</th>
                <th>estado</th>
                <th>clientes_dpi_cliete</th>
                <th>usuarios_codigo_usuario</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${listaVentas}">
                <td th:text="${v.codigo_venta}"></td>
                <td th:text="${v.fecha_venta}"></td>
                <td th:text="${v.total}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${v.estado == 1 ? 'bg-primary' : 'bg-danger'}"
                          th:text="${v.estado == 1 ? 'Pagado' : 'Pendiente'}">
                    </span>
                </td>
                <td th:text="${v.cliente != null ? v.cliente.dpi_cliente : ''}"></td>
                <td th:text="${v.usuario != null ? v.usuario.codigo_usuario : ''}"></td>
                <td>
                    <button class="btn btn-sm btn-warning"
                            th:onclick="prepararEditar([[${v.codigo_venta}]], [[${v.fecha_venta}]], [[${v.cliente.dpi_cliente}]], [[${v.usuario.codigo_usuario}]], [[${v.total}]], [[${v.estado}]])">
                        Editar
                    </button>
                    <a th:href="@{/Ventas/eliminar/{id}(id=${v.codigo_venta})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Eliminar registro?')">
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="ventaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Nueva Venta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/Ventas/guardar}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="codigo_venta" id="modal_id">

                    <div class="mb-3">
                        <label class="form-label">fecha_venta</label>
                        <input type="date" name="fecha_venta" id="modal_fecha" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">total</label>
                        <input type="number" step="0.01" name="total" id="modal_total" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">estado</label>
                        <select name="estado" id="modal_estado" class="form-select">
                            <option value="1">Pagado (1)</option>
                            <option value="0">Pendiente (0)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">clientes_dpi_cliete</label>
                        <select name="cliente.dpi_cliente" id="modal_cliente" class="form-select" required>
                            <option value="">Seleccione DPI...</option>
                            <option th:each="c : ${listaClientes}"
                                    th:value="${c.dpi_cliente}"
                                    th:text="${c.dpi_cliente} + ' - ' + ${c.nombre_cliente}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">usuarios_codigo_usuario</label>
                        <select name="usuario.codigo_usuario" id="modal_usuario" class="form-select" required>
                            <option value="">Seleccione Código...</option>
                            <option th:each="u : ${listaUsuarios}"
                                    th:value="${u.codigo_usuario}"
                                    th:text="${u.codigo_usuario} + ' - ' + ${u.username}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('ventaModal'));

    function nuevaVenta() {
        document.getElementById('modalTitle').innerText = 'Nueva Venta';
        document.getElementById('modal_id').value = '';

        const hoy = new Date();
        const fechaFormateada = hoy.toISOString().split('T')[0];

        document.getElementById('modal_fecha').value = fechaFormateada;
        document.getElementById('modal_cliente').value = '';
        document.getElementById('modal_usuario').value = '';
        document.getElementById('modal_total').value = '';
        document.getElementById('modal_estado').value = '1';
        modal.show();
    }

    function prepararEditar(id, fecha, clienteId, usuarioId, total, estado) {
        document.getElementById('modalTitle').innerText = 'Editar Venta';
        document.getElementById('modal_id').value = id;
        document.getElementById('modal_fecha').value = fecha;
        document.getElementById('modal_cliente').value = clienteId;
        document.getElementById('modal_usuario').value = usuarioId;
        document.getElementById('modal_total').value = total;
        document.getElementById('modal_estado').value = estado;
        modal.show();
    }
</script>
</body>
</html>
