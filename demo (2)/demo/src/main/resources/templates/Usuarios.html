<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/UsuariosP.css}">
</head>
<body class="bg-light">

<nav class="navbar mb-4 custom-nav">
    <div class="container-fluid">
        <a th:href="@{/home}" class="back-link">⬅ Volver al Home</a>
        <span class="navbar-title">Control de Usuarios</span>
    </div>
</nav>

<div class="container bg-white p-4 shadow-sm rounded">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Registro de Usuarios</h2>
        <button type="button" class="btn btn-success" onclick="nuevoUsuario()">+ Agregar Usuario</button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Username</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${listaUsuarios}">
                <td th:text="${u.codigo_usuario}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${u.rol == 'ADMIN' ? 'bg-dark' : 'bg-secondary'}"
                          th:text="${u.rol}">
                    </span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${u.estado == 1 ? 'bg-primary' : 'bg-danger'}"
                          th:text="${u.estado == 1 ? 'Activo' : 'Inactivo'}">
                    </span>
                </td>
                <td>
                    <button class="btn btn-sm btn-warning"
                            th:onclick="prepararEditar([[${u.codigo_usuario}]], [[${u.username}]], [[${u.password}]], [[${u.email}]], [[${u.rol}]], [[${u.estado}]])">
                        Editar
                    </button>
                    <a th:href="@{/Usuarios/eliminar/{id}(id=${u.codigo_usuario})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Eliminar este usuario?')">
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="usuarioModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Nuevo Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/Usuarios/guardar}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="codigo_usuario" id="modal_id">

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" id="modal_username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" id="modal_password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" id="modal_email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol" id="modal_rol" class="form-select" required>
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select name="estado" id="modal_estado" class="form-select">
                            <option value="1">Activo (1)</option>
                            <option value="0">Inactivo (0)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('usuarioModal'));

    function nuevoUsuario() {
        document.getElementById('modalTitle').innerText = 'Nuevo Usuario';
        document.getElementById('modal_id').value = '';
        document.getElementById('modal_username').value = '';
        document.getElementById('modal_password').value = '';
        document.getElementById('modal_email').value = '';
        document.getElementById('modal_rol').value = 'USER';
        document.getElementById('modal_estado').value = '1';
        modal.show();
    }

    function prepararEditar(id, username, password, email, rol, estado) {
        document.getElementById('modalTitle').innerText = 'Editar Usuario';
        document.getElementById('modal_id').value = id;
        document.getElementById('modal_username').value = username;
        document.getElementById('modal_password').value = password;
        document.getElementById('modal_email').value = email;
        document.getElementById('modal_rol').value = rol;
        document.getElementById('modal_estado').value = estado;
        modal.show();
    }
</script>
</body>
</html>
