<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Ventas - Detalles</title>
    <link rel="stylesheet" th:href="@{/DetalleVentaP.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="custom-nav">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a th:href="@{/home}" class="back-link">← Volver al Home</a>
        <span class="navbar-title">SISTEMA DE VENTAS</span>
    </div>
</nav>

<main class="container bg-white p-0">
    <div class="d-flex justify-content-between align-items-center p-4 bg-white">
        <h2>Registro de Detalles</h2>
        <button class="btn btn-success" onclick="abrirModalCrear()">+ Generar Detalle</button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>CANTIDAD</th>
                <th>PRECIO U.</th>
                <th>SUBTOTAL</th>
                <th>PRODUCTO</th>
                <th>VENTA</th>
                <th>ACCIONES</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="det : ${detalles}">
                <td th:text="${det.codigo_detalle_venta}"></td>
                <td th:text="${det.cantidad}"></td>
                <td th:text="${det.precio_unitario}"></td>
                <td>
                    <span class="badge bg-primary" th:text="'Q' + ${det.subtotal}"></span>
                </td>
                <td th:text="${det.producto != null ? det.producto.codigo_producto : 'N/A'}"></td>
                <td th:text="${det.venta != null ? det.venta.codigo_venta : 'N/A'}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <button class="btn btn-warning btn-sm"
                                th:onclick="`abrirModalEditar(${det.codigo_detalle_venta}, ${det.cantidad}, ${det.precio_unitario}, ${det.producto != null ? det.producto.codigo_producto : 0}, ${det.venta != null ? det.venta.codigo_venta : 0})`">
                            Editar
                        </button>
                        <button class="btn btn-danger btn-sm"
                                th:onclick="'eliminarDetalle(' + ${det.codigo_detalle_venta} + ')'">
                            Eliminar
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: none; overflow: hidden;">
            <div class="modal-header custom-nav" style="border-radius: 0;">
                <h5 class="modal-title text-white" id="modalTitulo">Nuevo Detalle</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formDetalle">
                <div class="modal-body p-4">
                    <input type="hidden" id="edit-id">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">ID Producto</label>
                            <input type="number" id="edit-producto" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">ID Venta</label>
                            <input type="number" id="edit-venta" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Cantidad</label>
                            <input type="number" id="edit-cantidad" class="form-control" required oninput="calcularSubtotal()">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Precio Unitario</label>
                            <input type="number" step="0.01" id="edit-precio" class="form-control" required oninput="calcularSubtotal()">
                        </div>
                    </div>

                    <div class="mb-0">
                        <label class="form-label fw-bold">Subtotal Estimado</label>
                        <input type="number" id="edit-subtotal" class="form-control bg-light" readonly>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success px-4">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const modalBootstrap = new bootstrap.Modal(document.getElementById('modalDetalle'));

    function calcularSubtotal() {
        const c = parseFloat(document.getElementById('edit-cantidad').value) || 0;
        const p = parseFloat(document.getElementById('edit-precio').value) || 0;
        document.getElementById('edit-subtotal').value = (c * p).toFixed(2);
    }

    function abrirModalCrear() {
        document.getElementById('modalTitulo').innerText = "Nuevo Detalle";
        document.getElementById('formDetalle').reset();
        document.getElementById('edit-id').value = "";
        modalBootstrap.show();
    }

    function abrirModalEditar(id, cant, prec, prodId, vtaId) {
        document.getElementById('modalTitulo').innerText = "Editar Detalle #" + id;
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-cantidad').value = cant;
        document.getElementById('edit-precio').value = prec;
        document.getElementById('edit-producto').value = prodId;
        document.getElementById('edit-venta').value = vtaId;
        calcularSubtotal();
        modalBootstrap.show();
    }

    document.getElementById('formDetalle').onsubmit = function(e) {
        e.preventDefault();
        const idVal = document.getElementById('edit-id').value;
        const detalle = {
            codigo_detalle_venta: idVal ? parseInt(idVal) : null,
            cantidad: parseInt(document.getElementById('edit-cantidad').value),
            precio_unitario: parseFloat(document.getElementById('edit-precio').value),
            producto: { codigo_producto: parseInt(document.getElementById('edit-producto').value) },
            venta: { codigo_venta: parseInt(document.getElementById('edit-venta').value) }
        };

        fetch('/DetalleVenta/guardar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(detalle)
        }).then(res => {
            if (res.ok) location.reload();
            else alert('Error al guardar. Verifica que los IDs existan.');
        });
    };

    function eliminarDetalle(id) {
        if (confirm('¿Deseas eliminar este registro?')) {
            fetch('/DetalleVenta/eliminar/' + id, { method: 'DELETE' })
                .then(res => res.ok ? location.reload() : alert('Error al eliminar'));
        }
    }
</script>
</body>
</html>
